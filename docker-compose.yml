name: real2-sales-dashboard

x-runtime-environment: &runtime-environment
  APP_URL: "${APP_URL:-http://localhost:3000}"
  DATABASE_URL: "postgresql://postgres:postgres@host.docker.internal:54322/postgres"
  SUPABASE_URL: "http://host.docker.internal:54321"
  SUPABASE_ANON_KEY: "${REAL2_SUPABASE_ANON_KEY:-local-anon-key}"
  SUPABASE_SERVICE_ROLE_KEY: "${REAL2_SUPABASE_SERVICE_ROLE_KEY:-local-service-role-key}"
  AMO_CLIENT_ID: "synthetic-client-id"
  AMO_CLIENT_SECRET: "synthetic-client-secret-change-before-use"
  AMO_REDIRECT_URI: "https://dashboard.example.invalid/api/integrations/amo/callback"
  TOKEN_ENCRYPTION_KEY: "bG9jYWwtc3ludGhldGljLWVuY3J5cHRpb24ta2V5ISE="
  SYNC_ENABLED: "false"
  SHEET_PUBLISH_ENABLED: "false"

x-service-security: &service-security
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  web:
    <<: *service-security
    build:
      context: .
      dockerfile: Dockerfile.web
    environment: *runtime-environment
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    extra_hosts:
      - host.docker.internal:host-gateway
    tmpfs:
      - /tmp
      - /app/apps/web/.next/cache
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3

  worker:
    <<: *service-security
    profiles:
      - worker
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment: *runtime-environment
    restart: "no"
    extra_hosts:
      - host.docker.internal:host-gateway
    tmpfs:
      - /tmp
